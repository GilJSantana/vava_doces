site_name: 'Vava Doces Docs'
site_description: 'Documentação do projeto Vava Doces'
site_author: 'Vava Doces Dev'
repo_name: ''
nav:
  - Home: index.md
  - Quick Start Streamlit: QUICK_START_STREAMLIT.md
  - Quick Start Faturamento: QUICK_START_FATURAMENTO.md
  - Arquitetura Técnica: ARQUITETURA_TECNICA.md
  - Segurança OAuth2: IMPLEMENTACAO_SEGURANCA_OAUTH2.md
  - Gold Layer Integration: GOLD_LAYER_INTEGRATION.md
  - Guia de Inicialização: operacional/GUIA_INICIALIZACAO.md
  - Guia do Usuário de Negócio: GUIA_USUARIO_NEGOCIO.md
  - Roadmap: NEXT_STEPS.md
  - Arquivo Histórico: archive/README.md

theme:
  name: material
  # Use the project logo and favicon (copiados to docs/images/)
  logo: 'images/logo.png'
  favicon: 'images/favicon.png'
  palette:
    scheme: default
    primary: 'green'
    accent: 'amber'
  font:
    text: 'Playfair Display'
    code: 'Roboto Mono'

extra_css:
  - 'assets/css/extra.css'

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - footnotes
